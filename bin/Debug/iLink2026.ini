#################################################################
# iLink Configuration File
#
# iLink is an application for attaching failcodes to nextcap from a variety 
# of external sources.
#
# This file is used to specify the source of data for the iLink application
#
# Please do not change unless you are 100% certain of what you are doing
#
# For Details on modifying call Mark Davis or Sanjit Tamhane
#################################################################
[GENERAL]
RefreshInterval = 10
LoadToNextcap = False
DoubleCheckNextcap = False
LogEventsToFile = True
NumDaysLogFile = 3
NumDaysDataToStore = 12
NumCapRetryAttempts = 10
GoodPenCode = NTF
CapDefectLevel	= 2
RuleIniFile = tij2x_gen2_rules.ini
MfgDBType = SQL-SERVER

[TestTypes]
CheckForInspectorResults = True
CheckForEtesterResults = False
CheckForEtesterRegionFails = False
CheckForKahunaRegionFails = False

#################################################################
# These are the mapping details of the Inspector stations
#################################################################
[INSPECTOR]
FileStyle	= Inspector
ShareBanks	= True
numOfColumns	= 7
FileExtension   = txt
numOfBanks	= 1
Bank1		= C:\work\project\nextcap\iLink\iLink2026\SummaryLog_EncryptTxt
Bank1Alias 	= SummaryLogBank


#################################################################
# Etest Specific Details
#################################################################
[ETESTER]
SQL  = stamp like 'et5k%'

#################################################################
# Kahuna Specific Details
#################################################################
[KAHUNA]  
SQL  = 
