#################################################################
# The following sections define the rules used to identify
# failures and the corresponding failcodes which will be updated 
# in NextCap.
#
# The commands available are: 
#
# Logical AND = 'AND' or '&'
# Logical OR  = 'OR' or '|'
# Logical NOT = 'NOT' or '!'
# You can use nested brackets "(",")" for precedence grouping.
#
# DO NOT MODIFY THESE RULES WITHOUT FIRST TESTING IN THE FILE
# rule_tester.xls
#
#################################################################
[RULES]
numOfRules 	= 4
Rule1		= ('FRG_PR' OR 'FRG_NA' OR 'FRG_RG' OR 'FRG') AND NOT ('NTF_K' OR 'NTF_E')
SetFailcode1	= FRG
Rule2		= 'FET' AND NOT 'NTF_E'
SetFailcode2	= FET
Rule3		= 'NTF' AND NOT 'NTFG' AND NOT 'FBDG' AND ('FNPG' OR 'FDRG' OR 'FMDG' OR 'FWNG')
SetFailcode3	= NTF
Rule4		= 'NTFG' AND NOT 'NTF' AND NOT 'FBD' AND ('FNP' OR 'FDR' OR 'FMD' OR 'FWN' OR 'FSP' OR 'FER' OR 'FBL' OR 'FOD')
SetFailcode4	= NTF

numTestLevels	= 4
TestLevel1	= ETESTER
TestLevel2	= KAHUNA
TestLevel3	= PLAIN
TestLevel4	= GLOSSY


#################################################################
# Failing rule matches, iLink will try to match high priority failcodes
#################################################################
[SpecialFailcodes]
CodesToIgnore	= |BOG|

#################################################################
# Etest Specific Details
#################################################################
[ETESTER]
numOfPriorities = 2
Priority1	= 'FET','NTF_E'
Priority2	= 'FRG_NA','FRG_PR','FRG_RG','FRG'


#################################################################
# Plain Paper Specific Details
#################################################################
[PLAIN]  
numOfPriorities = 5
Priority1	= 'NTF'
Priority2	= 'FNP','FDR','FMD','FWN','FSP','FER','FBL','FOD'
Priority3	= 'FBD'
Priority4	= 'RBD'
Priority5	= 'FAE','FAP'

#################################################################
# Glossy Specific Details
#################################################################
[GLOSSY] 
numOfPriorities = 5
Priority1	= 'NTFG'
Priority2	= 'FNPG','FDRG','FMDG','FWNG'
Priority3	= 'FBDG'
Priority4	= 'RBDG'
Priority5	= 'FAEG','FAPG'

#################################################################
# Kahuna Specific Details
#################################################################
[KAHUNA]  
numOfPriorities = 2
Priority1	= 'NTF_K'
Priority2	= 'FRG_NA','FRG_PR','FRG_RG','FRG'

#################################################################
# Failures which have the following IPAS/set failcodes
# will be inserted into nextcap as the codes shown.
# 
# This allows us to differentiate between different test plots.
#################################################################
[MatchList]
NTF_E   = NTF
NTF_K 	= NTF
NTFG 	= NTF
FRG_PR  = FRG
FRG_NA  = FRG
FRG_RG  = FRG